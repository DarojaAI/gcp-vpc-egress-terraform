name: Pre-Commit Checks

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.py

      - name: Run filesystem checks
        run: |
          # Check for trailing whitespace in text files
          if grep -r ' $' --include='*.py' --include='*.tf' --include='*.yaml' --include='*.yml' --include='*.sh' --include='*.md' . 2>/dev/null | grep -v '.git/' | grep -v 'Binary'; then
            echo "ERROR: Trailing whitespace found"
            exit 1
          fi

      - name: Check for merge conflicts
        run: |
          if grep -r '<<<<<<<' --include='*.py' --include='*.tf' --include='*.yaml' --include='*.yml' --include='*.sh' --include='*.md' . 2>/dev/null | grep -v '.git/'; then
            echo "ERROR: Merge conflict markers found"
            exit 1
          fi

      - name: Check YAML syntax
        run: python3 .github/scripts/check_yaml.py

      - name: Check JSON syntax
        run: python3 .github/scripts/check_json.py

      - name: Check for large files
        run: python3 .github/scripts/check_large_files.py

      - name: Install and run yamllint
        run: |
          pip install yamllint
          yamllint -s .github/workflows/ || true

      - name: Check shell scripts with shellcheck
        run: |
          apt-get update && apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -exec shellcheck {} \; || true

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: terraform
        run: terraform validate

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Initialize TFLint
        working-directory: terraform
        run: tflint --init --config=../.tflint.hcl

      - name: Run TFLint
        working-directory: terraform
        run: tflint --config=../.tflint.hcl
  # P1.3 (issue #13): terraform test against a plan-only fixture using
  # mock_provider (Terraform 1.7+). Catches schema mismatches and
  # unresolved references that `terraform validate` misses, without
  # requiring GCP credentials. The fixture is intentionally minimal:
  # one run block asserting VPC ID + subnet CIDR round-trip under the
  # mocked google provider. See test/fixtures/plan-only/plan_only.tftest.hcl
  # for the test surface and the rationale on the >= 1.7 minimum.
  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'

      - name: Initialize plan-only fixture
        working-directory: test/fixtures/plan-only
        run: terraform init -backend=false

      - name: Run terraform test (mock_provider + run block)
        working-directory: test/fixtures/plan-only
        run: terraform test

  # P0 contract regression coverage (issue #32): terraform test against the
  # test/contract fixture. Backs the *public contract* of this consumable
  # module — output keys + resource counts by use_existing branch. Contract
  # drift is silent across every consumer (dev-nexus, rag_research_tool,
  # postgres-terraform), so this gate runs in CI. mock_provider avoids GCP
  # credentials. Both run blocks are `command = apply` (safe under mock)
  # because computed attributes are unknown during plan.
  #
  # Precondition-message regression (criterion #3 of #32) is NOT expressible
  # here: the required data sources live inside module.vpc_egress, and
  # terraform test's expect_failures cannot address child-module objects.
  # See test/contract/contract.tftest.hcl for the documented limitation.
  terraform-contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'

      - name: Initialize contract fixture
        working-directory: test/contract
        run: terraform init -backend=false

      - name: Run terraform test (contract regression)
        working-directory: test/contract
        run: terraform test
